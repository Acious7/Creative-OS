<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243B"/>
      <stop offset="100%" stop-color="#09101C"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D58C"/>
      <stop offset="50%" stop-color="#C9A55C"/>
      <stop offset="100%" stop-color="#8E6C2E"/>
    </linearGradient>
    <filter id="dropShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)"/>
  
  <!-- Back Document Sheet (Layered Effect) -->
  <rect x="180" y="80" width="220" height="310" rx="16" fill="#1E2F4A" stroke="url(#goldGrad2)" stroke-width="2" transform="rotate(8 290 235)" opacity="0.7"/>

  <!-- Front Main Document Sheet -->
  <g filter="url(#dropShadow2)">
    <rect x="116" y="100" width="240" height="330" rx="20" fill="#FFFFFF"/>
    
    <!-- Gold Top Banner Accent -->
    <path d="M 116,120 C 116,108.954 124.954,100 136,100 L 336,100 C 347.046,100 356,108.954 356,120 L 356,140 L 116,140 Z" fill="url(#goldGrad2)"/>
    
    <!-- Embossed Crest 'B' Monogram -->
    <path d="M 190,180 L 255,180 C 282,180 298,193 298,212 C 298,225 288,235 274,239 C 292,243 304,255 304,272 C 304,295 282,306 255,306 L 190,306 Z M 224,204 L 224,226 L 250,226 C 259,226 265,221 265,215 C 265,209 259,204 250,204 Z M 224,254 L 224,280 L 254,280 C 264,280 270,274 270,267 C 270,260 264,254 254,254 Z" fill="#0F1B2D"/>
    
    <!-- Modern Document Indicator Rows -->
    <rect x="156" y="340" width="160" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="156" y="362" width="110" height="10" rx="5" fill="url(#goldGrad2)"/>
  </g>
</svg>
