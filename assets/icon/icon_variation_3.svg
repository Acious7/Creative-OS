<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE094"/>
      <stop offset="40%" stop-color="#C9A55C"/>
      <stop offset="100%" stop-color="#836224"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad3)"/>

  <!-- Outer Geometric Shield / Hexagon Frame -->
  <polygon points="256,44 420,138 420,328 256,422 92,328 92,138" fill="none" stroke="url(#goldGrad3)" stroke-width="8" stroke-linejoin="round" opacity="0.4"/>

  <!-- Inner Hexagon Shield -->
  <g filter="url(#shadow3)">
    <polygon points="256,64 400,148 400,318 256,402 112,318 112,148" fill="#14243B" stroke="url(#goldGrad3)" stroke-width="4"/>
  </g>

  <!-- Minimalist Stylized Document & B Emblem -->
  <g filter="url(#shadow3)">
    <!-- White Minimal Document Base -->
    <path d="M 180,140 L 300,140 L 332,172 L 332,340 C 332,348.837 324.837,356 316,356 L 180,356 C 171.163,356 164,348.837 164,340 L 164,156 C 164,147.163 171.163,140 180,140 Z" fill="#FFFFFF"/>
    <path d="M 300,140 L 300,172 L 332,172 Z" fill="#CBD5E1"/>

    <!-- Integrated Gold 'B' Monogram Cutout -->
    <path d="M 206,180 L 260,180 C 278,180 290,190 290,204 C 290,214 282,222 272,225 C 285,229 294,238 294,252 C 294,268 278,276 260,276 L 206,276 Z M 230,198 L 230,216 L 254,216 C 260,216 266,212 266,207 C 266,202 260,198 254,198 Z M 230,238 L 230,258 L 256,258 C 263,258 270,253 270,248 C 270,243 263,238 256,238 Z" fill="url(#goldGrad3)"/>

    <!-- Document Checkmark Badge -->
    <circle cx="296" cy="310" r="24" fill="url(#goldGrad3)"/>
    <path d="M 286,310 L 293,317 L 307,303" fill="none" stroke="#0F1B2D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
