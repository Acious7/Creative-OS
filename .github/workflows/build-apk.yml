name: Build Creative OS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.jvmargs=-Xmx4096m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Assemble Release APK
        run: |
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/creative-os.apk || cp build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/creative-os.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: creative-os-release-apk
          path: build/app/outputs/flutter-apk/creative-os.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.1.2
          name: "Creative OS v2.1.2 (Release)"
          body: |
            ### 🎨 Creative OS - Mobile Operating System for Creative Entrepreneurs
            Download and install **`creative-os.apk`** below on any Android phone.

            #### ⚡ Features & Modules
            - 📍 **Location-First Network Hub:** Venue and meeting tracking, OpenStreetMap place search, 1-tap GPS venue detection, and Google Maps navigation.
            - 💼 **Full Freelance CRM:** Pipelines (*Inquiry, Pitched, Negotiation, Won, Lost*), real-time revenue tally (KES), 1-tap quote drafting, and VIP Rolodex.
            - 📝 **Dual-Level Meeting Notes & Reminders:** Meeting recaps + attendee notes with exact alarm notifications.
            - 📑 **Instant Business Docs:** Generate client quotations, invoices, contracts, receipts, and rate cards.
            - 💳 **Digital NFC & QR Business Card:** Share credentials and contact cards in 1 tap.
            - 🔒 **100% Offline-First:** Isolated SQLite database with zero subscription lock-in.
          files: |
            build/app/outputs/flutter-apk/creative-os.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
