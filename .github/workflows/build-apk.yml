name: Build Creative OS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.jvmargs=-Xmx4096m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Assemble Release APK
        run: |
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/creative-os.apk || cp build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/creative-os.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: creative-os-release-apk
          path: build/app/outputs/flutter-apk/creative-os.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.2.1
          name: "Creative OS v2.2.1 (Release)"
          body: |
            ### 🎨 Creative OS - Mobile Operating System for Creative Entrepreneurs
            **Designed & Architected by Brian Etole**
            - Official Domain: **brianetole.com**
            - Official Contact: **hello@brianetole.com**
            Download and install **`creative-os.apk`** below on any Android phone.

            #### ⚡ Features & Modules (v2.2.0)
            - 🧘 **The Sanctuary:** 6 wellness & focus portals (Stillness, The Forge, Creative Vault, Reflections, Digital Sabbath, Gratitude) with dual ambient audio soundscapes (Rain on Zinc Roof & Acacia Winds).
            - 🐕 **Studio Watchdogs & Visual Recipe Builder:** Autonomous local monitoring for overdue debts, VAT/WHT tax escrow, weekly backups, plus a visual custom automation builder.
            - 🎓 **Studio Academy & Guided Tour:** 12 comprehensive chapters covering every studio workflow and interactive tour.
            - 🎬 **Production Slate & Set Management:** Call sheets, gear manifests, crew rosters, and live production handover portals.
            - 💳 **3D Digital Business Card & NFC Beam:** Interactive 3D perspective tilt, Maasai bead geometries, NFC beam, vCard export, and 10-per-A4 vector print PDF generator.
            - 📍 **Location-First Network Rolodex:** Venue memory, on-device OCR business card scanner, and physical occasion tracking.
            - 📑 **Financial & Legal Engine:** Quotations, invoices, receipts, rate cards, and contracts with dynamic `{PREFIX}-{NUM}` numbering and tap-to-edit.
            - 🔒 **100% Offline-First:** Isolated SQLite database with zero subscription lock-in.
          files: |
            build/app/outputs/flutter-apk/creative-os.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
